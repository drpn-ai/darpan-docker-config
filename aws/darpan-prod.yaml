AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Darpan production on Darpan's own AWS project (DAR-OPS-006): one Moqui backend on ECS Fargate ARM64 behind an
  HTTPS ALB, single-AZ RDS MySQL 8.4, EFS for runtime/datamanager run files. Derived from darpan-uat.yaml and kept
  deliberately small: a NAT instance (not a NAT Gateway) for one fixed outbound IP, no OpenSearch, no Multi-AZ. The SOC 2
  audit layer (DAR-OPS-018) is single-Region: CloudTrail, VPC flow logs, ALB access logs, a regional WAF, ECS Exec
  session logs, a year of log retention. Configuration arrives by the admin app's config transfer (credentials sealed to this instance), not by a
  database dump, so run history is regenerated here.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: >-
      ALB(443, AllowedCidr) -> Fargate task :8080 (private subnet, egress via NAT instance + Elastic IP) -> RDS
      (private) + EFS (private)
    must:
      - DesiredCount <= 1 (in-process Moqui scheduler; 2 tasks double-run automations)
      - SchedulerEnabled stays false until cutover, so a rehearsal never runs a tenant's automations
      - entity_ds_crypt_pass (it decrypts every stored token) changes only by the rotation runbook (DAR-OPS-019); the
        outgoing key goes into a secret named CryptPassOldSecret wired through CryptPassOldSecretArn, the new key is put
        into CryptPassSecret as a new version (never regenerate or replace that resource), rotate#EncryptedFieldValues
        re-encrypts every row, then CryptPassOldSecretArn goes back to empty
      - no secret values in this file or its parameters; Secrets Manager only
      - no client or tenant names in this file (the repo is public)
      - every IAM role carries the deployer stack's AppRoleBoundary (RoleBoundaryPolicyName); a role that needs a new AWS
        permission needs the boundary widened in darpan-deployer.yaml first, or the permission silently does nothing
      - everything stays in this one Region (new AWS experience): single-Region trail, regional WAF, no us-east-1 resources
    ref: darpan-docker-config/docker/prod/Dockerfile, darpan-docker-config/docker/prod/entrypoint.sh, darpan-uat.yaml

Parameters:
  AllowedCidr:
    Type: String
    Description: >-
      CIDR allowed to reach the load balancer. Your own a.b.c.d/32 during the rehearsal; 0.0.0.0/0 at cutover,
      when this ALB becomes the public API.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  HostName:
    Type: String
    Description: Public name CNAMEd at the load balancer (rehearsal name first, then api.drpn.ai at cutover).
    MinLength: 1
  CertificateArn:
    Type: String
    Description: ACM certificate in this Region covering HostName (issued outside the stack; DNS validation at Netlify).
    AllowedPattern: '^arn:aws:acm:.+'
  ImageTag:
    Type: String
    Default: prod
    Description: Tag of the darpan image in this stack's ECR repository.
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: 0 until an image is pushed; then 1. Never more (see Metadata must).
  SchedulerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      false sets scheduled_job_check_time=0, so Moqui runs no scheduled job (no automations, no audits). Flip to
      true only at cutover, after the old instance's automations are paused.
  TaskCpu:
    Type: String
    Default: '2048'
    AllowedValues: ['1024', '2048', '4096']
  TaskMemory:
    Type: String
    Default: '8192'
    AllowedValues: ['8192', '16384']
    Description: Heap is 75% of this, capped at 6 GB by the image's JAVA_OPTS, so more than 8 GB buys little.
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.small, db.t4g.medium, db.t4g.large, db.m7g.large]
    Description: db.t4g.small (2 GB) to start; Moqui's pool asks for up to 140 connections. Needs the Paid plan.
  DbBackupRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 35
    Description: >-
      Automated backup (point-in-time restore) days. 14 for SOC 2 (DAR-OPS-018): two weeks to notice a bad change to
      configuration, users or stored credentials, which live only here. Run results and findings regenerate.
  LogRetentionDays:
    Type: Number
    Default: 365
    AllowedValues: [90, 180, 365, 400, 545, 731]
    Description: >-
      Days kept for the app, ECS Exec, VPC flow and WAF log groups and the ALB access-log bucket (DAR-OPS-018, SOC 2:
      a full year of audit window). CloudTrail has its own fixed lock + expiry (see TrailBucket).
  RoleBoundaryPolicyName:
    Type: String
    Default: darpan-prod-deployer-app-role-boundary
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'
    Description: >-
      Name of the managed permissions boundary the deployer stack creates (darpan-deployer.yaml AppRoleBoundary,
      <deployer stack>-app-role-boundary). Every role below carries it; InfraChangeRole may only create or extend
      roles that do (DAR-OPS-018).
  WafMode:
    Type: String
    Default: block
    AllowedValues: [block, count]
    Description: >-
      block: the web ACL's managed rule groups and rate rule block what they match. count: they only count and log
      (a soak to read the WAF log for false positives before enforcing). The first rollout may use count for a few
      days; leave it on block after that, since a counting WAF protects nothing.
  WafRateLimitPer5Min:
    Type: Number
    Default: 2000
    MinValue: 100
    MaxValue: 2000000000
    Description: >-
      Requests per client IP per 5 minutes before the rate rule acts (~6.7/s sustained). Raise it if a partner
      integration or an office NAT legitimately exceeds it (the WAF log names the IP).
  FlowLogTrafficType:
    Type: String
    Default: ALL
    AllowedValues: [ALL, REJECT]
    Description: ALL records accepted and rejected flows (SOC 2 network evidence); REJECT is the cheaper fallback.
  UpgradeDataTypes:
    Type: String
    Default: seed,seed-initial,install,ext-seed,ext,darpan-seed-initial,darpan-seed
    Description: >-
      Data types the entrypoint loads before Moqui starts. The default is the first-boot load on an empty
      database; switch to darpan-seed after the first successful boot.
  CryptPassOldSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:CryptPassOldSecret-[A-Za-z0-9]{6}$'
    Description: >-
      Empty except during a field-encryption key rotation (DAR-OPS-019). Then: the ARN of a secret named
      CryptPassOldSecret holding the OUTGOING entity_ds_crypt_pass. The task gets it as entity_ds_crypt_pass_old, so
      Moqui still decrypts old-key values while rotate#EncryptedFieldValues re-encrypts them under the new key in
      CryptPassSecret. Only the task definition changes, so deploy.sh --set flips it; clear it after the sweep.
  AllowOrigins:
    Type: String
    Default: ''
    Description: >-
      Overrides Moqui_WEBAPP_ALLOW_ORIGINS. Empty keeps the prod image's own list (app.drpn.ai only; UAT UI code never gets signed-in calls to prod). Set
      it during the rehearsal only, e.g. to add a local darpan-ui origin.
  AgentEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      DARPAN_AGENT_ENABLED (DAR-BE-159): the embedded agent's server switch. A tenant also needs agentEnabled=Y and a user a
      live AI access grant before anything is sent to Claude. Kill switch: deploy.sh prod --tag <current> --set AgentEnabled=false.
  AnthropicFederationRuleId:
    Type: String
    Default: fdrl_016PDR99kZBkv94xWScGGqSz
    Description: >-
      Anthropic workload identity federation (DAR-BE-244): the rule that maps this stack's task role to the service account
      below. Empty turns federation off (the agent then has no credential). None of these four ids is a secret.
  AnthropicOrganizationId:
    Type: String
    Default: 84833ad5-d832-4d93-ac5d-facaf7081a74
  AnthropicServiceAccountId:
    Type: String
    Default: svac_019Uc4oi7HGAgELDq7NAKfeW
  AnthropicWorkspaceId:
    Type: String
    Default: wrkspc_01HY9rfrgeeGYCw4JTr7rif5
  AppBaseUrl:
    Type: String
    Default: https://app.drpn.ai
    AllowedPattern: '^https://[^/\s]+$'
    Description: >-
      DARPAN_APP_BASE_URL: the app origin that audit run emails, chat cards and CLI sign-in links point at. The code has
      no default (a missing value drops the link), so prod must carry it (DAR-BE-207).
  TimeZone:
    Type: String
    Default: UTC
  AlertEmail:
    Type: String
    Description: Receives the alarm and budget emails (the alarm subscription needs one confirmation click).
  MonthlyBudgetUsd:
    Type: Number
    Default: 175
  NatAmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Amazon Linux 2023 arm64 AMI for the NAT instance, pinned on purpose (read the current one from
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64). Not an SSM-path parameter: that
      re-resolves on every update, so an AWS AMI release would replace the NAT inside an image deploy.
  NatInstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.micro, t4g.small]
    Description: t4g.nano to start; t4g.micro if large extract downloads drain its network burst.

Mappings:
  # Elastic Load Balancing's log-delivery account for Regions launched before August 2022 (us-east-2 is one). FindInMap
  # fails for any other Region, which is the point: this stack lives only in us-east-2.
  ElbLogDelivery:
    us-east-2: { AccountId: '033677994240' }

Conditions:
  SchedulerOff: !Equals [!Ref SchedulerEnabled, 'false']
  WafBlock: !Equals [!Ref WafMode, block]
  HasAllowOrigins: !Not [!Equals [!Ref AllowOrigins, '']]
  HasCryptPassOld: !Not [!Equals [!Ref CryptPassOldSecretArn, '']]
  HasAnthropicFederation: !Not [!Equals [!Ref AnthropicFederationRuleId, '']]
  HasTask: !Equals [!Ref DesiredCount, 1]

Resources:
  # ---------- Network ----------
  Vpc:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: 10.50/16 so it never overlaps UAT's 10.40/16 if the two are ever peered
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-a' }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-b' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          the task sits in the private subnets and leaves through the NAT instance, so every outbound call shows
          one fixed Elastic IP that partners can allowlist (DAR-OPS-016). RDS and EFS share these subnets but never
          start outbound connections, and the NAT admits only the task's security group
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private' }]

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: NatEipAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: waits for the Elastic IP so the first packet through the NAT already carries the allowlisted address
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NatInstance

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Metadata:
      com.aws.cloudformation.Context:
        why: free; ECR image layers download from S3, so deploys' image pulls skip the NAT instance
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # ---------- NAT instance (fixed outbound IP) ----------
  NatSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NAT instance - forwards traffic from the Darpan task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: '-1'
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Darpan task egress to forward

  NatRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Session Manager access (no SSH port, no key pair), plus SignalResource on this stack only, because
          cfn-signal signs with the instance role when one is attached and an unauthorised signal stalls the update
    Properties:
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${RoleBoundaryPolicyName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: signal-nat-ready
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId

  NatInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref NatRole]

  NatInstance:
    Type: AWS::EC2::Instance
    DependsOn: GatewayAttachment
    CreationPolicy:
      ResourceSignal: { Count: 1, Timeout: PT15M }
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          a NAT instance instead of a NAT Gateway (~$4-7/mo vs ~$33/mo + $0.045/GB). Boots with a temporary public
          IP so it can install packages, signals only once forwarding works, then the Elastic IP replaces that IP.
          The forwarding rules live in a systemd unit so they come back after every reboot and auto-recovery
        must:
          - SourceDestCheck false (a NAT forwards traffic that is neither from nor to itself)
          - a single point of failure for ALL task egress (partner APIs, CloudWatch logs, Secrets Manager, ECR auth)
          - ImageId changes replace it; the Elastic IP moves, but egress drops for the minutes that takes
    Properties:
      ImageId: !Ref NatAmiId
      InstanceType: !Ref NatInstanceType
      IamInstanceProfile: !Ref NatInstanceProfile
      SourceDestCheck: false
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref PublicSubnetA
          GroupSet: [!Ref NatSecurityGroup]
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nat' }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            # the failing line travels in the signal's reason, so a failure is readable in the stack events
            # even after rollback has terminated the instance
            signal() { /opt/aws/bin/cfn-signal -e "$1" --reason "$2" --stack ${AWS::StackName} --resource NatInstance --region ${AWS::Region} || true; }
            trap 'rc=$?; signal 1 "nat setup failed at line $LINENO (exit $rc): $BASH_COMMAND | $(journalctl -u darpan-nat -n 3 -o cat --no-pager 2>/dev/null | tr "\n" " " | cut -c1-300)"' ERR
            for try in 1 2 3; do
              dnf -y install iptables-nft aws-cfn-bootstrap dnf-automatic && break
              if [ "$try" = 3 ]; then trap - ERR; signal 1 "dnf install failed 3 times (see /var/log/cloud-init-output.log)"; exit 1; fi
              sleep 15
            done
            cat > /usr/local/sbin/darpan-nat <<'EOF'
            #!/bin/bash
            set -euo pipefail
            sysctl -q -w net.ipv4.ip_forward=1
            sysctl -q -w net.ipv4.conf.all.send_redirects=0
            IF=$(ip -o -4 route show to default | awk '{print $5; exit}')
            iptables -t nat -C POSTROUTING -o "$IF" -s ${VpcCidr} -j MASQUERADE 2>/dev/null \
              || iptables -t nat -A POSTROUTING -o "$IF" -s ${VpcCidr} -j MASQUERADE
            EOF
            chmod 0755 /usr/local/sbin/darpan-nat
            cat > /etc/systemd/system/darpan-nat.service <<'EOF'
            [Unit]
            Description=Darpan NAT (IP forwarding + masquerade)
            After=network-online.target
            Wants=network-online.target
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/local/sbin/darpan-nat
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now darpan-nat.service
            # security updates are wanted but not worth failing the NAT over
            { sed -i 's/^upgrade_type.*/upgrade_type = security/; s/^apply_updates.*/apply_updates = yes/' /etc/dnf/automatic.conf \
              && systemctl enable --now dnf-automatic.timer; } || echo "dnf-automatic not enabled" >&2
            iptables -t nat -S POSTROUTING | grep -q MASQUERADE
            signal 0 "nat forwarding up"
          - VpcCidr: !GetAtt Vpc.CidrBlock

  NatEip:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: the address partners allowlist; it outlives the NAT instance, a NAT Gateway swap, and even the stack
        must: [never release or replace once a partner has allowlisted it]
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-egress' }]

  NatEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      InstanceId: !Ref NatInstance

  # ---------- Security groups ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          the ALB is the public API after cutover, so AllowedCidr becomes 0.0.0.0/0 there by design; it is the only
          public surface (the task, DB and EFS admit only the security group in front of them)
        must: [port 80 only ever redirects to 443; nothing else listens]
    Properties:
      GroupDescription: Load balancer - HTTP (redirect) and HTTPS from AllowedCidr
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Redirect to HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
          Description: Darpan API (TLS)

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Darpan task - 8080 from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: ALB to Moqui

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL from the Darpan task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Darpan to MySQL

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from the Darpan task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Darpan to EFS

  # ---------- Image registry ----------
  Repository:
    Type: AWS::ECR::Repository
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          images rebuild from darpan-docker-config at a pinned ref; 10 kept so a rollback is one ImageTag change.
          IMMUTABLE (DAR-OPS-018): a tag always means the image that was first pushed under it, so the ImageTag in the
          stack and the deploy log identify exactly what ran. deploy.sh mints a fresh tag per build
          (<env>-<ref>-<UTC minute>-<sha7>, never the v0.0.x git tag itself) and a rollback (--tag) pushes nothing
        must: [no workflow may re-push an existing tag (no latest/prod moving tags); such a push now fails]
    Properties:
      RepositoryName: !Sub '${AWS::StackName}/darpan'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 10 newest images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

  # ---------- Secrets ----------
  CryptPassSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          entity_ds_crypt_pass encrypts every tenant's stored OMS/Shopify/NetSuite tokens. Fresh for this instance:
          the config transfer seals credentials to this instance, which stores them under this key
        must:
          - never regenerate or replace once tenant connections are saved; retained on stack delete
          - a new key only as a new secret version inside the rotation runbook, with the outgoing key wired through
            CryptPassOldSecretArn first (DAR-OPS-019)
    Properties:
      Description: Darpan entity_ds_crypt_pass (production)
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  JwtKeySecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: replacing it only signs every user out once
    Properties:
      Description: Darpan JWT_KEY (production)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          own secret instead of ManageMasterUserPassword: RDS rotates a managed master secret every 7 days by
          default, while ECS injects secrets only at task start, so after a rotation every new DB connection the
          running Moqui opens would fail until the task restarted
        must: [no rotation unless the rotation also restarts the ECS service; no punctuation (the entrypoint seds conf values)]
    Properties:
      Description: Darpan MySQL master user (production)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"darpanadmin"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  # ---------- Database ----------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Darpan private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          MoquiProductionConf sets pool-maxsize 140; t4g.small's formula default (~150) leaves no headroom for admin
          sessions. The slow query log (DAR-OPS-018) feeds the slowquery CloudWatch export; all three log settings are
          dynamic, so they apply without a reboot. No audit log: that needs the MariaDB audit plugin in an option group,
          which this stack does not have (CloudTrail covers the RDS control plane)
    Properties:
      Description: Darpan MySQL 8.4 (production)
      Family: mysql8.4
      Parameters:
        max_connections: '200'
        require_secure_transport: '1'
        slow_query_log: '1'
        long_query_time: '5'
        log_output: FILE

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          single-AZ on purpose (an AZ failure means a restore, tens of minutes, accepted for now); deletion
          protection and a final snapshot because users, configuration and credentials live only here. Error and slow
          query logs go to CloudWatch (DAR-OPS-018); RDS creates /aws/rds/instance/<id>/{error,slowquery} itself with
          no expiry (set 365 days once by hand after the first apply; CloudFormation cannot pre-create them without
          racing RDS, since the instance id is generated)
        must: [StorageEncrypted, not publicly accessible, DeletionProtection true]
    Properties:
      Engine: mysql
      EngineVersion: '8.4'
      DBInstanceClass: !Ref DbInstanceClass
      DBName: darpan
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}'
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      EnableCloudwatchLogsExports: [error, slowquery]
      PreferredBackupWindow: '19:00-19:30'
      PreferredMaintenanceWindow: 'sun:20:00-sun:20:30'
      AutoMinorVersionUpgrade: true
      DeletionProtection: true
      CopyTagsToSnapshot: true

  # ---------- Run files ----------
  FileSystem:
    Type: AWS::EFS::FileSystem
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          holds runtime/datamanager (reconciliation run files). Everything here regenerates by re-running, so no
          backup plan and no retain; files untouched for 30 days move to Infrequent Access
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy: { Status: DISABLED }
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemTags: [{ Key: Name, Value: !Sub '${AWS::StackName}-datamanager' }]

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]

  DatamanagerAccessPoint:
    Type: AWS::EFS::AccessPoint
    Metadata:
      com.aws.cloudformation.Context:
        why: every write lands as uid/gid 1000, so the volume is already right for the non-root moqui user (DAR-OPS-002)
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: '1000', Gid: '1000' }
      RootDirectory:
        Path: /datamanager
        CreationInfo: { OwnerUid: '1000', OwnerGid: '1000', Permissions: '0775' }

  # ---------- IAM ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${RoleBoundaryPolicyName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-darpan-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref CryptPassSecret
                  - !Ref JwtKeySecret
                  - !Ref DbMasterSecret
                  # The outgoing key during a rotation (CryptPassOldSecretArn). Granted by name, not by the parameter,
                  # so wiring or clearing it changes only the task definition.
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CryptPassOldSecret-*'

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          the app itself needs only EFS (IAM-authorized mount) and ECS Exec for debugging; no other AWS access. ECS Exec
          sessions are recorded (DAR-OPS-018): the in-task SSM agent writes each session's transcript to ExecLogGroup
          with this role, so it needs those log writes (the image must keep `script` and `cat`, which Ubuntu has)
    Properties:
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${RoleBoundaryPolicyName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: efs-and-exec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals: { 'elasticfilesystem:AccessPointArn': !GetAtt DatamanagerAccessPoint.Arn }
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:DescribeLogStreams, logs:PutLogEvents]
                Resource: !GetAtt ExecLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
        # Workload identity federation to Anthropic: the task mints short-lived AWS-signed JWTs for the Claude API
        # (darpan-agent) instead of holding an Anthropic API key. Only that audience, at most one hour; the
        # account has outbound web identity federation enabled, and Anthropic's federation rule matches this role.
        - PolicyName: anthropic-workload-identity
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MintAnthropicIdentityToken
                Effect: Allow
                Action: sts:GetWebIdentityToken
                Resource: '*'
                Condition:
                  'ForAllValues:StringEquals': { 'sts:IdentityTokenAudience': 'https://api.anthropic.com' }
                  'Null': { 'sts:IdentityTokenAudience': 'false' }
                  NumericLessThanEquals: { 'sts:DurationSeconds': 3600 }

  # ---------- Logs ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/darpan'
      RetentionInDays: !Ref LogRetentionDays

  ExecLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS Exec session transcripts (who ran what inside the prod task), DAR-OPS-018
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/exec'
      RetentionInDays: !Ref LogRetentionDays

  # ---------- Audit trail (DAR-OPS-018) ----------
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          CloudTrail's own bucket. Object Lock is set at creation (the only time S3 allows it, and CloudFormation
          supports it for a new bucket), so each log file is undeletable for 365 days in GOVERNANCE mode; the bucket
          policy also denies deletes and the governance bypass to every principal, so removing evidence first needs a
          bucket-policy change, which CloudTrail itself records. GOVERNANCE, not COMPLIANCE: compliance mode cannot be
          lifted even by the account root, so one wrong retention value would be permanent. Files expire at 400 days
          (365 locked + a margin for a year-end audit). SSE-S3, not KMS: no key policy to keep in step for ~$1/month
        must:
          - Object Lock cannot be turned off; dropping it means a new bucket (and trail change)
          - never in the IAM scope of an app role (the boundary grants no S3 object access)
    Properties:
      BucketName: !Sub '${AWS::StackName}-cloudtrail-${AWS::AccountId}'
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: { Mode: GOVERNANCE, Days: 365 }
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-400-days
            Status: Enabled
            ExpirationInDays: 400
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - Id: drop-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals: { 'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail' }
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail'
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }
          - Sid: NoEvidenceDeletes
            Effect: Deny
            Principal: '*'
            Action: [s3:DeleteObject, s3:DeleteObjectVersion, s3:BypassGovernanceRetention]
            Resource: !Sub '${TrailBucket.Arn}/*'

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          management events (every control-plane call: IAM, ECS, RDS, CloudFormation, Secrets Manager reads) in this
          Region, with digest files so tampering is detectable. Single-Region on purpose (the new AWS experience allows
          one Region). The first management-event trail in a Region is free; no data events (per-request cost)
        must:
          - IsMultiRegionTrail false
          - global-service events (IAM, STS, console sign-in) are recorded as us-east-1 events, so this trail may miss
            some of them; the 90-day Event history still has them. A multi-Region trail is not available here
    Properties:
      TrailName: !Sub '${AWS::StackName}-trail'
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

  # ---------- VPC flow logs (DAR-OPS-018) ----------
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpc/flowlogs/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  FlowLogsRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: VPC Flow Logs delivers to CloudWatch Logs as this role; it may write the flow log group only
    Properties:
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${RoleBoundaryPolicyName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*' }
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: !Ref FlowLogTrafficType
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      MaxAggregationInterval: 600
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-vpc' }]

  # ---------- ALB access logs (DAR-OPS-018) ----------
  AlbLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          one line per API request (client IP, path, status, latency, TLS). SSE-S3 because ALB access logs cannot be
          written under SSE-KMS; retained on stack delete because it is audit evidence
    Properties:
      BucketName: !Sub '${AWS::StackName}-alb-logs-${AWS::AccountId}'
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-retention
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  AlbLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          us-east-2 predates August 2022, so ELB delivers as its regional account; the logdelivery service principal is
          granted too (AWS's newer path) so a switch on AWS's side does not silently stop the logs
    Properties:
      Bucket: !Ref AlbLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ElbLogDeliveryAccount
            Effect: Allow
            Principal:
              AWS: !Sub
                - 'arn:aws:iam::${ElbAccountId}:root'
                - ElbAccountId: !FindInMap [ElbLogDelivery, !Ref 'AWS::Region', AccountId]
            Action: s3:PutObject
            Resource: !Sub '${AlbLogsBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*'
          - Sid: ElbLogDeliveryService
            Effect: Allow
            Principal: { Service: logdelivery.elasticloadbalancing.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AlbLogsBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*'
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AlbLogsBucket.Arn, !Sub '${AlbLogsBucket.Arn}/*']
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbLogsBucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          300 s idle timeout because some JSON-RPC calls (run now, transfer apply) take minutes. Access logs to
          AlbLogsBucket and deletion protection on (DAR-OPS-018); ELB writes a test object when logging is switched on,
          so the bucket policy must exist first (DependsOn). drop_invalid_header_fields stays OFF: an ALB treats any header name with an underscore as invalid, and
          Moqui authenticates with login_key / api_key headers (admin CLI + app, header-auth UI, API keys); with it on
          those headers vanish and every call answers "User must be logged in". Desync mitigation stays defensive.
        must:
          - routing.http.drop_invalid_header_fields.enabled false while Moqui auth headers contain underscores
          - deletion protection blocks a stack delete or an ALB replacement; turn it off in its own reviewed change first
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '300'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'false'
        - Key: routing.http.desync_mitigation_mode
          Value: defensive
        - Key: deletion_protection.enabled
          Value: 'true'
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref AlbLogsBucket
        - Key: access_logs.s3.prefix
          Value: alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          /status answers only 127.0.0.1 (webroot.xml) and logs every rejection, so the ALB probes / instead.
          Tuned for one task replaced in place: 10 s probes mark a new task healthy ~40 s sooner than 30 s,
          and 15 s draining (was 60) because nobody is left on the old task to drain. 10 misses x 10 s keeps
          the same ~100 s tolerance before a busy task (long run, GC) is marked unhealthy and replaced.
        must: [UnhealthyThresholdCount x HealthCheckIntervalSeconds >= 100]
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 8
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      Matcher: { HttpCode: '200-399' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      com.aws.cloudformation.Context:
        why: TLS ends at the ALB; it forwards plain HTTP to :8080 with X-Forwarded-Proto https, which Moqui reads to stop its https redirect
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- Web application firewall (DAR-OPS-018) ----------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          regional web ACL on the ALB (no CloudFront, so nothing in us-east-1). IP reputation, then a per-IP rate
          limit, then AWS's known-bad-inputs (Log4Shell, Java deserialization: this is a JVM app) and common rule
          sets. SizeRestrictions_BODY only COUNTs: it blocks any body over 8 KB, and Darpan legitimately sends far
          more inside JSON-RPC bodies (the Diff page reads an uploaded CSV/JSON file and posts its text, the JSON
          Schema wizard posts a whole schema, config transfer posts a whole bundle). The other body rules inspect
          only the first 8 KB of those bodies (an ALB's fixed inspection limit) and let the rest through
        must:
          - SizeRestrictions_BODY stays COUNT while uploads travel inside JSON bodies
          - health checks bypass the WAF (the ALB probes the target directly), so a WAF mistake shows as client 403s,
            not as a task replacement; read the WAF log before raising or relaxing anything
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Description: Darpan API ALB - managed rule groups and a per-IP rate limit
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-alb'
      Rules:
        - Name: aws-ip-reputation
          Priority: 0
          OverrideAction: !If [WafBlock, { None: {} }, { Count: {} }]
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-ip-reputation }
        - Name: rate-per-ip
          Priority: 1
          Action: !If [WafBlock, { Block: {} }, { Count: {} }]
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
              EvaluationWindowSec: 300
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-per-ip }
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction: !If [WafBlock, { None: {} }, { Count: {} }]
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-known-bad-inputs }
        - Name: aws-common
          Priority: 3
          OverrideAction: !If [WafBlock, { None: {} }, { Count: {} }]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-common }

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: WAF requires the aws-waf-logs- prefix; only blocked and counted requests are kept (see WafLogging)
    Properties:
      LogGroupName: !Sub 'aws-waf-logs-${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          keeps only requests a rule blocked or counted (the evidence for tuning and for incident review), so allowed
          traffic costs nothing here; ALB access logs already have every request. Moqui's credential headers and the
          query string are redacted before they are written
        must: [login_key, api_key, authorization and cookie stay in RedactedFields (they are live credentials)]
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}'
      RedactedFields:
        - SingleHeader: { Name: login_key }
        - SingleHeader: { Name: api_key }
        - SingleHeader: { Name: authorization }
        - SingleHeader: { Name: cookie }
        - QueryString: {}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition: { Action: BLOCK }
              - ActionCondition: { Action: COUNT }
              - ActionCondition: { Action: EXCLUDED_AS_COUNT }

  # ---------- Compute ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Container Insights off (cut); the alarms below read the free AWS/ECS and AWS/ApplicationELB metrics. ECS Exec
          stays on for debugging, and every session's transcript goes to ExecLogGroup (DAR-OPS-018); a task picks the
          setting up when it starts, so the first deploy or restart after this change turns recording on
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: OVERRIDE
          LogConfiguration:
            CloudWatchLogGroupName: !Ref ExecLogGroup
            CloudWatchEncryptionEnabled: false

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-darpan'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: datamanager
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref DatamanagerAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: darpan
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:${ImageTag}'
          Essential: true
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - SourceVolume: datamanager
              ContainerPath: /moqui-framework/runtime/datamanager
          Environment:
            - { Name: Moqui_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: Moqui_DB_NAME, Value: darpan }
            - { Name: Moqui_HOST, Value: !Ref HostName }
            - { Name: TIME_ZONE, Value: !Ref TimeZone }
            - { Name: DARPAN_LOAD_UPGRADE_DATA, Value: 'Y' }
            - { Name: DARPAN_UPGRADE_DATA_TYPES, Value: !Ref UpgradeDataTypes }
            - { Name: DARPAN_APP_BASE_URL, Value: !Ref AppBaseUrl }
            - { Name: DARPAN_AGENT_ENABLED, Value: !Ref AgentEnabled }
            # DAR-BE-244: darpan-agent reaches Claude by workload identity federation, never an API key (ANTHROPIC_API_KEY
            # must stay unset: it outranks federation). The agent mints an AWS-signed JWT for the task role into the token
            # file (container-local, owner-only, replaced every 15 min) and the Anthropic SDK exchanges it.
            - !If [HasAnthropicFederation, { Name: ANTHROPIC_FEDERATION_RULE_ID, Value: !Ref AnthropicFederationRuleId }, !Ref AWS::NoValue]
            - !If [HasAnthropicFederation, { Name: ANTHROPIC_ORGANIZATION_ID, Value: !Ref AnthropicOrganizationId }, !Ref AWS::NoValue]
            - !If [HasAnthropicFederation, { Name: ANTHROPIC_SERVICE_ACCOUNT_ID, Value: !Ref AnthropicServiceAccountId }, !Ref AWS::NoValue]
            - !If [HasAnthropicFederation, { Name: ANTHROPIC_WORKSPACE_ID, Value: !Ref AnthropicWorkspaceId }, !Ref AWS::NoValue]
            - !If [HasAnthropicFederation, { Name: ANTHROPIC_IDENTITY_TOKEN_FILE, Value: /tmp/darpan-anthropic/identity.jwt }, !Ref AWS::NoValue]
            # Moqui reads an env var named like a default-property in place of the conf value; 0 = no scheduler.
            - !If
              - SchedulerOff
              - { Name: scheduled_job_check_time, Value: '0' }
              - !Ref AWS::NoValue
            - !If
              - HasAllowOrigins
              - { Name: Moqui_WEBAPP_ALLOW_ORIGINS, Value: !Ref AllowOrigins }
              - !Ref AWS::NoValue
          Secrets:
            - { Name: Moqui_DB_USER, ValueFrom: !Sub '${DbMasterSecret}:username::' }
            - { Name: Moqui_DB_PASSWORD, ValueFrom: !Sub '${DbMasterSecret}:password::' }
            - { Name: entity_ds_crypt_pass, ValueFrom: !Ref CryptPassSecret }
            - { Name: JWT_KEY, ValueFrom: !Ref JwtKeySecret }
            # Rotation window only; unset, the entrypoint and MoquiProductionConf.xml default it to entity_ds_crypt_pass.
            - !If [HasCryptPassOld, { Name: entity_ds_crypt_pass_old, ValueFrom: !Ref CryptPassOldSecretArn }, !Ref AWS::NoValue]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: darpan

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, MountTargetA, MountTargetB, PrivateDefaultRoute, PrivateSubnetARoutes, PrivateSubnetBRoutes, S3GatewayEndpoint]
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          replace-in-place deploys (0% min healthy) so two schedulers never overlap; a deploy is a few minutes of
          downtime while the new task boots. Long grace covers the first-boot data load
        must: [DesiredCount <= 1, MaximumPercent 100]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 1800
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: darpan
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ---------- Alarms ----------
  AlertTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          unencrypted on purpose: CloudWatch cannot publish to a topic under the AWS-managed aws/sns key, and the
          messages carry only alarm names and metric values
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  NoHealthyTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasTask
    Metadata:
      com.aws.cloudformation.Context:
        why: 10 minutes so an ordinary deploy (old task stops, new one boots) does not page
    Properties:
      AlarmDescription: Darpan has had no healthy task behind the load balancer for 10 minutes
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Moqui answered more than 25 server errors in 5 minutes
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  TaskMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasTask
    Metadata:
      com.aws.cloudformation.Context:
        why: heap is capped at 6 GB of 8, so steady 92%+ means native memory is near the cgroup limit (OOM kill next)
    Properties:
      AlarmDescription: Darpan task memory above 92% for 10 minutes
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 92
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Darpan MySQL CPU above 80% for 15 minutes (burstable credits draining)
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  NatInstanceCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          an OS-level hang on the NAT cuts all task egress; reboot it and say so. Hardware (system check) failures
          are handled by EC2 simplified auto-recovery, which keeps the instance id and the Elastic IP
    Properties:
      AlarmDescription: Darpan NAT instance failed its instance status check for 3 minutes (rebooting it); task egress is down
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions:
        - { Name: InstanceId, Value: !Ref NatInstance }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic, !Sub 'arn:aws:automate:${AWS::Region}:ec2:reboot']
      OKActions: [!Ref AlertTopic]

  NatSystemCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Darpan NAT instance failed its system status check (EC2 auto-recovery should move it); task egress is down
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - { Name: InstanceId, Value: !Ref NatInstance }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DbFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          storage autoscaling grows the volume toward MaxAllocatedStorage, but at most once per 6 hours and never past
          it; under 2 GiB free for 15 minutes means it is not keeping up or has hit the ceiling (DAR-OPS-018)
    Properties:
      AlarmDescription: Darpan MySQL has had under 2 GiB of free storage for 15 minutes
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DbConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          max_connections is 200 and one task's pool tops out at 140; above 170 for 10 minutes means a leak, a second
          task, or admin sessions crowding out the app (DAR-OPS-018)
    Properties:
      AlarmDescription: Darpan MySQL has held more than 170 connections for 10 minutes (max_connections 200)
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 170
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          5xx the load balancer itself answers (no healthy target, target timeouts or resets), which
          HTTPCode_Target_5XX_Count never sees. Two 5-minute periods, because a deploy's few minutes with no task
          answer 503 by design and should not page (DAR-OPS-018)
    Properties:
      AlarmDescription: The load balancer answered more than 25 of its own 5xx in each of two consecutive 5-minute periods
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ---------- Cost guard ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  BaseUrl:
    Value: !Sub 'https://${HostName}'
  LoadBalancerDnsName:
    Description: CNAME target for HostName
    Value: !GetAtt LoadBalancer.DNSName
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  AlertTopicArn:
    Value: !Ref AlertTopic
  NatPublicIp:
    Description: The fixed outbound IP every partner call comes from; give this to partners to allowlist
    Value: !Ref NatEip
  TrailBucketName:
    Description: CloudTrail log files (Object Lock, 365 days)
    Value: !Ref TrailBucket
  AlbLogsBucketName:
    Description: ALB access logs (prefix alb/)
    Value: !Ref AlbLogsBucket
  FlowLogGroupName:
    Value: !Ref FlowLogGroup
