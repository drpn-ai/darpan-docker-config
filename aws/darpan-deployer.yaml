AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Darpan deployer (DAR-OPS-010): one CodeBuild project that runs aws/deploy.sh inside AWS, so "deploy prod" is a
  single start-build of this project (no laptop, no CLI profile). It clones this public repo, runs deploy.sh with the
  arguments given (build in <env>-build, change set on the app stack, roll the task, check health and the boot log),
  under a role that can change only the app stack and what a deploy touches.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    must:
      - the deployer role plans and starts app-stack updates only; CloudFormation applies them as StackUpdateRole, which
        may change only what a deploy touches (task definitions, the service, its alarms, the ALB SG ingress) and read
        what a stack update resolves (task role ARNs, DB endpoint and master secret, ALB, repository); no IAM writes
      - deploy.sh's own rails stay in force (change-set whitelist, DesiredCount <= 1, boot-log check)
      - every role the app stack creates or changes carries AppRoleBoundary (DAR-OPS-018); InfraChangeRole cannot create a
        role, add a policy to one, or move a boundary without it once AppRoleBoundaryEnforced is true
      - this stack names its boundary policy, so its own updates need CAPABILITY_NAMED_IAM
      - no secrets or client names in this file (the repo is public)
    ref: darpan-docker-config/aws/deploy.sh, darpan-docker-config/aws/darpan-prod.yaml, darpan-docker-config/aws/darpan-build.yaml

Parameters:
  DeployEnv:
    Type: String
    Default: prod
    AllowedValues: [prod, uat]
    Description: The deploy.sh target this project runs.
  AppStackName:
    Type: String
    Default: darpan-prod
  BuildProjectName:
    Type: String
    Default: darpan-prod-build
  EcrRepositoryName:
    Type: String
    Default: darpan-prod/darpan
  SourceRepoUrl:
    Type: String
    Default: https://github.com/drpn-ai/darpan-docker-config.git
  LogRetentionDays:
    Type: Number
    Default: 365
    AllowedValues: [90, 180, 365, 400, 545, 731]
    Description: >-
      Deploy log retention (DAR-OPS-018, SOC 2): every deploy's who/what/when (args, component commits, change set,
      verification) stays readable for a year of audit window.
  AppRoleBoundaryEnforced:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      true: InfraChangeRole may create an app-stack role, put or attach a policy on one, or set a boundary only with
      AppRoleBoundary. false is for the ONE rollout window (DAR-OPS-018) while the app stack's existing roles, created
      without a boundary, receive it (it also lets a failed rollout's rollback remove the boundary again); flip back to
      true right after that app-stack change set completes.

Conditions:
  EnforceBoundary: !Equals [!Ref AppRoleBoundaryEnforced, 'true']

Resources:
  DeployLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  AppRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Permissions boundary for every role the app stack creates (DAR-OPS-018). InfraChangeRole can write inline
          policies on AppStackName-* roles, so without a boundary a reviewed-but-wrong template could mint an
          admin-equivalent role. The boundary is the ceiling: the union of what the task execution role, task role, NAT
          role and VPC flow-log role legitimately need, and nothing else (no IAM, no S3 objects, no data-plane writes
          beyond logs). A role's effective access is its own policy AND this.
        must:
          - widen it in the same change that gives an app-stack role a new AWS permission, or that permission silently
            does nothing (the boundary intersects, it never errors at create time)
          - InfraChangeRole holds no iam:*Policy* action on it, so the role it constrains cannot edit it
          - mirrors AmazonSSMManagedInstanceCore's actions explicitly (not ssm:*: SendCommand would be an escalation path)
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-app-role-boundary'
      Description: !Sub 'Permissions boundary for ${AppStackName} roles (DAR-OPS-018)'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PullAppImage
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: PullAppImageLayers
            Effect: Allow
            Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
            Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AppStackName}/*'
          - Sid: WriteAppLogs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppStackName}/*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/flowlogs/${AppStackName}*'
          - Sid: DescribeLogGroups
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: ReadAppSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CryptPassSecret-*'
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:JwtKeySecret-*'
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:DbMasterSecret-*'
              # The outgoing field-encryption key during a rotation (app stack CryptPassOldSecretArn, DAR-OPS-019).
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CryptPassOldSecret-*'
          - Sid: MountRunFiles
            Effect: Allow
            Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
            Resource: !Sub 'arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/*'
          - Sid: SessionManagerChannels
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: '*'
          - Sid: SsmManagedInstanceCore
            Effect: Allow
            Action:
              - ssm:DescribeAssociation
              - ssm:DescribeDocument
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:GetManifest
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:PutInventory
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
            Resource: '*'
          - Sid: NatReadySignal
            Effect: Allow
            Action: cloudformation:SignalResource
            Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
          - Sid: AnthropicWorkloadIdentity
            Effect: Allow
            Action: sts:GetWebIdentityToken
            Resource: '*'

  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The deployer's own identity: it plans and starts stack updates, but CloudFormation applies them as
          StackUpdateRole (passed with --role-arn), so this role holds only what deploy.sh itself calls: change sets
          on the app stack, the image build, the force-new-deployment of --restart, and reads for the health checks.
          It cannot register task definitions, pass the task roles, touch the ALB security group or read any secret.
        must: [no secretsmanager access, iam:PassRole only for StackUpdateRole and only to cloudformation]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: deploy-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AppStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/deploy-*/*'
              # A stack lets anyone who may operate on it use its stored service role without iam:PassRole. After
              # an admin applies a template change as InfraChangeRole, that role stays stored until the next
              # deploy, so the deployer must never plan a change without naming StackUpdateRole (a missing
              # RoleArn also matches ArnNotEquals, so a role-less change set is refused too).
              - Sid: OnlyAsStackUpdateRole
                Effect: Deny
                Action: [cloudformation:CreateChangeSet, cloudformation:CreateStack, cloudformation:UpdateStack]
                Resource: '*'
                Condition:
                  ArnNotEquals: { 'cloudformation:RoleArn': !GetAtt StackUpdateRole.Arn }
              - Sid: StackEvents
                Effect: Allow
                Action: [cloudformation:DescribeEvents, cloudformation:DescribeStackEvents]
                Resource: '*'
              - Sid: PassStackUpdateRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StackUpdateRole.Arn
                Condition:
                  StringEquals: { 'iam:PassedToService': cloudformation.amazonaws.com }
              # --restart forces a new deployment of the same task definition directly (no change set).
              - Sid: EcsAppService
                Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${AppStackName}-Cluster-*/${AppStackName}-Service-*'
              - Sid: EcsAppTasks
                Effect: Allow
                Action: [ecs:ListTasks, ecs:DescribeTasks]
                Resource:
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${AppStackName}-Cluster-*/*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${AppStackName}-Cluster-*/*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${AppStackName}-Cluster-*'
              - Sid: HealthReads
                Effect: Allow
                Action: [elasticloadbalancing:DescribeTargetHealth, elasticloadbalancing:DescribeTargetGroups]
                Resource: '*'
              - Sid: BuildImage
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds, codebuild:BatchGetProjects]
                Resource: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${BuildProjectName}'
              - Sid: ImageTag
                Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
              - Sid: ReadBuildAndAppLogs
                Effect: Allow
                Action: [logs:GetLogEvents, logs:FilterLogEvents]
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${BuildProjectName}:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppStackName}/darpan:*'
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${DeployLogGroup.Arn}:*'

  StackUpdateRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          CloudFormation's service role for the app stack. A stack update resolves every !GetAtt and dynamic reference
          it touches with the executing identity: the task roles' ARNs (iam:GetRole), the DB endpoint
          (rds:DescribeDBInstances), the Database's Secrets Manager dynamic references (master credentials), and the ALB, target
          group and repository in the outputs and alarms. Three deployer runs failed one missing read at a time; this
          role holds them so the deployer never does. Writes stay limited to what a deploy changes: task definition,
          service, the stack's alarms and the ALB security group ingress (AllowedCidr).
        must: [assumable only by cloudformation in this account, no rds/efs/secret writes]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: update-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # RegisterTaskDefinition / DescribeTaskDefinition support no resource scoping.
              - Sid: EcsTaskDefinitions
                Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: '*'
              - Sid: EcsAppService
                Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService, ecs:TagResource]
                Resource:
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${AppStackName}-Cluster-*/${AppStackName}-Service-*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AppStackName}-darpan:*'
              - Sid: EcsAppFamily
                Effect: Allow
                # ECS authorises DeregisterTaskDefinition on resource '*' and sends no ecs:task-definition key, so
                # the old StringLike condition never matched: every deploy since 2026-11-04 left the replaced
                # revision ACTIVE (DELETE_FAILED in cleanup). Deregistering never stops a running task.
                Action: ecs:DeregisterTaskDefinition
                Resource: '*'
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-TaskExecutionRole-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-TaskRole-*'
                Condition:
                  StringEquals: { 'iam:PassedToService': ecs-tasks.amazonaws.com }
              - Sid: ReadTaskRoles
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-TaskExecutionRole-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-TaskRole-*'
              - Sid: TaskAlarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:DescribeAlarms, cloudwatch:TagResource]
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppStackName}-*'
              # CloudFormation checks an AWS-typed parameter as the executing role on every update: NatAmiId is
              # AWS::EC2::Image::Id (DAR-OPS-016), so without this the v3.0.0 deploy rolled back with AccessDenied
              # on ec2:DescribeImages. Read-only; DescribeImages supports no resource scoping.
              - Sid: ValidateParameterTypes
                Effect: Allow
                Action: ec2:DescribeImages
                Resource: '*'
              - Sid: AlbIngressForAllowedCidr
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/aws:cloudformation:stack-name': !Ref AppStackName
                    'aws:ResourceTag/aws:cloudformation:logical-id': AlbSecurityGroup
              - Sid: Reads
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeLoadBalancers
                Resource: '*'
              - Sid: ReadAppDatabase
                Effect: Allow
                Action: rds:DescribeDBInstances
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${AppStackName}-database-*'
              # The Database's MasterUsername/MasterUserPassword are {{resolve:secretsmanager:DbMasterSecret}}; every
              # stack update re-resolves them. Read only, the app stack's DB secret only (its generated name).
              - Sid: ResolveDbMasterSecret
                Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:DbMasterSecret-*'
              - Sid: RepositoryOutput
                Effect: Allow
                Action: [ecr:DescribeRepositories]
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
              # DAR-OPS-018 added the trail, WAF, flow logs and log buckets. A deploy never changes them, but three
              # earlier runs each died on one read nobody predicted, so the reads a stack update could make on them
              # are granted up front. Read-only; none of these supports narrower resource scoping that holds here.
              - Sid: ReadAuditResources
                Effect: Allow
                Action:
                  - cloudtrail:GetTrail
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:DescribeTrails
                  - wafv2:GetWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:GetLoggingConfiguration
                  - ec2:DescribeFlowLogs
                  - logs:DescribeLogGroups
                  - ecs:DescribeClusters
                Resource: '*'
              - Sid: ReadLogBuckets
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketPolicy]
                Resource: !Sub 'arn:aws:s3:::${AppStackName}-*'

  InfraChangeRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          CloudFormation's service role for reviewed TEMPLATE changes to the app stack (DAR-OPS-016 onward). A stack
          keeps the last service role it was given and can swap it but never drop it, so once deploys associated
          StackUpdateRole, a template change that adds resources outside a deploy's scope (the NAT instance, Elastic
          IP, routes, an IAM role) needs a broader role. Only the admin who reviews the change set passes this one
          (create-change-set --role-arn); DeployRole cannot (its PassRole is StackUpdateRole only), so unattended
          deploys stay least-privilege. Covers the services darpan-prod.yaml uses (DAR-OPS-018 added CloudTrail, WAF,
          VPC flow logs and the two log buckets); IAM writes only on the app stack's own roles and instance profiles,
          and only under AppRoleBoundary. After it applies a change, the next deployer run hands the stack back to
          StackUpdateRole.
        must:
          - assumable only by cloudformation in this account
          - never passable by DeployRole or any automation
          - IAM writes stay limited to AppStackName-* roles and instance profiles, never this stack's own roles
          - CreateRole / PutRolePolicy / AttachRolePolicy / PutRolePermissionsBoundary require AppRoleBoundary
            (AppRoleBoundaryEnforced true); DeleteRolePermissionsBoundary exists only while it is false
          - S3 writes only on AppStackName-* buckets (bucket config, never objects); CloudTrail writes only on
            AppStackName-* trails; WAF writes only on AppStackName-* web ACLs
          - DeployRole keeps its OnlyAsStackUpdateRole deny (otherwise the deployer inherits this role while stored)
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: change-app-stack-template
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AppStackServices
                Effect: Allow
                Action:
                  - ec2:*
                  - ecs:*
                  - elasticloadbalancing:*
                  - rds:*
                  - elasticfilesystem:*
                  - ecr:*
                  - logs:*
                  - cloudwatch:*
                  - sns:*
                  - budgets:*
                  - acm:DescribeCertificate
                  - secretsmanager:GetRandomPassword
                Resource: '*'
              # DAR-OPS-018: CloudTrail handler permissions (create/update/read), scoped to the app stack's trail.
              - Sid: AuditTrail
                Effect: Allow
                Action: 'cloudtrail:*'
                Resource: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AppStackName}-*'
              - Sid: AuditTrailReads
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:ListTrails
                  - cloudtrail:GetTrail
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:ListTags
                  - cloudtrail:GetEventSelectors
                  - cloudtrail:GetInsightSelectors
                  # the Trail handler checks whether the account is in an organization (read-only)
                  - organizations:DescribeOrganization
                  - organizations:ListAWSServiceAccessForOrganization
                Resource: '*'
              # DAR-OPS-018: the regional web ACL, its ALB association and its logging configuration.
              - Sid: WebAcl
                Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - wafv2:PutLoggingConfiguration
                  - wafv2:DeleteLoggingConfiguration
                  - wafv2:TagResource
                  - wafv2:UntagResource
                Resource:
                  - !Sub 'arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/${AppStackName}-*/*'
                  - !Sub 'arn:aws:wafv2:${AWS::Region}:*:regional/managedruleset/*/*'
                  # the ALB's generated name does not start with the stack name, so the association names any ALB here
                  - !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/*'
              - Sid: WebAclReads
                Effect: Allow
                Action: ['wafv2:Get*', 'wafv2:List*', 'wafv2:Describe*', wafv2:CheckCapacity]
                Resource: '*'
              # DAR-OPS-018: the ALB access-log and CloudTrail buckets. Bucket configuration only, never objects.
              - Sid: LogBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - 's3:GetBucket*'
                  - 's3:PutBucket*'
                  - s3:DeleteBucketPolicy
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetAccelerateConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetReplicationConfiguration
                Resource: !Sub 'arn:aws:s3:::${AppStackName}-*'
              - Sid: AppStackSecrets
                Effect: Allow
                Action: secretsmanager:*
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CryptPassSecret-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:JwtKeySecret-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:DbMasterSecret-*'
              # Actions that cannot widen a role's access. (UpdateAssumeRolePolicy changes who may assume it, but the
              # boundary still caps what the role can do.)
              - Sid: AppStackRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/${AppStackName}-*'
              # Actions that grant access: only on a role that carries (or is created with) AppRoleBoundary. For
              # PutRolePolicy the key is the role's CURRENT boundary, so a role created before DAR-OPS-018 must get
              # the boundary first: that is the one window AppRoleBoundaryEnforced=false exists for.
              - Sid: AppStackRolesUnderBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePolicy]
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition: !If
                  - EnforceBoundary
                  - StringEquals: { 'iam:PermissionsBoundary': !Ref AppRoleBoundary }
                  - !Ref AWS::NoValue
              - Sid: SetAppRoleBoundary
                Effect: Allow
                Action: iam:PutRolePermissionsBoundary
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition:
                  StringEquals: { 'iam:PermissionsBoundary': !Ref AppRoleBoundary }
              # Rollout window only (AppRoleBoundaryEnforced=false): if the app-stack change set that first adds the
              # boundary fails, its rollback removes the boundary again; without this the stack would stick in
              # UPDATE_ROLLBACK_FAILED. Gone once enforcement is back on, so a boundary can never be removed after.
              - !If
                - EnforceBoundary
                - !Ref AWS::NoValue
                - Sid: RollbackWindowRemoveBoundary
                  Effect: Allow
                  Action: iam:DeleteRolePermissionsBoundary
                  Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
              - Sid: ReadAppRoleBoundary
                Effect: Allow
                Action: [iam:GetPolicy, iam:GetPolicyVersion]
                Resource: !Ref AppRoleBoundary
              - Sid: AppStackRolesManagedPolicies
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition: !If
                  - EnforceBoundary
                  - ArnEquals:
                      'iam:PolicyARN':
                        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
                        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
                    StringEquals: { 'iam:PermissionsBoundary': !Ref AppRoleBoundary }
                  - ArnEquals:
                      'iam:PolicyARN':
                        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
                        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
              - Sid: DetachAppStackRolesManagedPolicies
                Effect: Allow
                Action: iam:DetachRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
              - Sid: PassAppStackRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition:
                  StringEquals:
                    'iam:PassedToService': [ecs-tasks.amazonaws.com, ec2.amazonaws.com, vpc-flow-logs.amazonaws.com]
              # ${AppStackName}-* also matches this deployer stack's own roles (darpan-prod-deployer-*).
              - Sid: NeverTheDeployerRoles
                Effect: Deny
                Action: 'iam:*'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/${AWS::StackName}-*'
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName':
                      - events.amazonaws.com
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com
                      - elasticfilesystem.amazonaws.com
                      - wafv2.amazonaws.com
              - Sid: EncryptedVolumesAndSecrets
                Effect: Allow
                Action: [kms:CreateGrant, kms:Decrypt, kms:DescribeKey, 'kms:GenerateDataKey*', 'kms:ReEncrypt*']
                Resource: '*'
                Condition:
                  StringEquals:
                    'kms:ViaService':
                      - !Sub 'ec2.${AWS::Region}.amazonaws.com'
                      - !Sub 'rds.${AWS::Region}.amazonaws.com'
                      - !Sub 'elasticfilesystem.${AWS::Region}.amazonaws.com'
                      - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'

  Deployer:
    Type: AWS::CodeBuild::Project
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          NO_SOURCE + inline buildspec: clones the public repo at SCRIPTS_REF (default main) for deploy.sh itself and
          passes DEPLOY_ARGS through, e.g. "--ref v0.0.4", "--tag <tag> --set DesiredCount=1", "--restart". deploy.sh
          always runs with --yes here: starting a build of this project IS the decision to deploy.
        must: [ConcurrentBuildLimit 1 (one deploy at a time), no PrivilegedMode (no Docker needed)]
    Properties:
      Name: !Sub '${AWS::StackName}'
      Description: !Sub 'Deploy the Darpan backend to ${DeployEnv} with aws/deploy.sh (DAR-OPS-010)'
      ServiceRole: !GetAtt DeployRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 45
      QueuedTimeoutInMinutes: 30
      Artifacts: { Type: NO_ARTIFACTS }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref DeployLogGroup }
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        EnvironmentVariables:
          - { Name: SOURCE_REPO_URL, Value: !Ref SourceRepoUrl }
          - { Name: SCRIPTS_REF, Value: main }
          - { Name: DEPLOY_ENV, Value: !Ref DeployEnv }
          - { Name: DEPLOY_ARGS, Value: '' }
          # deploy.sh passes it to create-change-set (--role-arn): CloudFormation applies the update as this role.
          - { Name: DARPAN_CFN_ROLE_ARN, Value: !GetAtt StackUpdateRole.Arn }
          # deploy.sh's account guard: this project can only ever run in its own account.
          - { Name: !Sub 'DARPAN_${DeployEnv}_ACCOUNT', Value: !Ref AWS::AccountId }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                - set -euo pipefail
                - test -n "$DEPLOY_ARGS" || { echo "DEPLOY_ARGS is required, e.g. --ref v0.0.4 | --tag <tag> | --restart"; exit 2; }
                - git clone --quiet "$SOURCE_REPO_URL" src && git -C src checkout --quiet "$SCRIPTS_REF"
                - export DARPAN_UAT_ACCOUNT="${DARPAN_uat_ACCOUNT:-}" DARPAN_PROD_ACCOUNT="${DARPAN_prod_ACCOUNT:-}"
                - echo "deploy.sh $DEPLOY_ENV $DEPLOY_ARGS --yes  (scripts at $(git -C src rev-parse --short HEAD))"
                - src/aws/deploy.sh "$DEPLOY_ENV" $DEPLOY_ARGS --yes

Outputs:
  ProjectName:
    Value: !Ref Deployer
  LogGroupName:
    Value: !Ref DeployLogGroup
  InfraChangeRoleArn:
    Description: Pass as --role-arn on a reviewed template change set for the app stack (never from automation)
    Value: !GetAtt InfraChangeRole.Arn
  AppRoleBoundaryArn:
    Description: Permissions boundary every app-stack role carries (darpan-prod.yaml RoleBoundaryPolicyName names it)
    Value: !Ref AppRoleBoundary
