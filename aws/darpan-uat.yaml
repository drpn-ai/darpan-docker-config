AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Darpan UAT rehearsal on Darpan's own AWS project (DAR-OPS-006): one Moqui backend on ECS Fargate
  ARM64 behind an ALB, RDS MySQL 8.4, EFS for runtime/datamanager run files. One task only, because
  Moqui's scheduler runs in-process and two tasks would double-run jobs. No NAT: the task sits in a
  public subnet with a public IP but accepts traffic only from the ALB.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: ALB(http, AllowedCidr only) -> Fargate task :8080 (public subnet, no NAT) -> RDS (private) + EFS (private)
    must:
      - DesiredCount <= 1 (in-process Quartz/Moqui scheduler; 2 tasks double-run automations)
      - entity_ds_crypt_pass never changes once tenant connections exist (it decrypts every stored token)
      - no secret values in this file or its parameters; Secrets Manager only
    ref: darpan-docker-config/docker/Dockerfile, darpan-docker-config/docker/entrypoint.sh

Parameters:
  AllowedCidr:
    Type: String
    Description: The only CIDR allowed to reach the load balancer (your IP as a.b.c.d/32).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  ImageTag:
    Type: String
    Default: uat
    Description: Tag of the darpan image in this stack's ECR repository.
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: 0 until an image is pushed; then 1. Never more (see Metadata must).
  TaskCpu:
    Type: String
    Default: '2048'
    AllowedValues: ['1024', '2048', '4096']
  TaskMemory:
    Type: String
    Default: '8192'
    AllowedValues: ['4096', '8192', '16384']
    Description: Heap is 75% of this, capped at 6 GB by the image's JAVA_OPTS.
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large, db.m7g.large]
    Description: db.t4g.micro (1 GB) is a Free-plan fallback only; Moqui's pool asks for 140 connections.
  DbBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: The Free plan refuses 7 ("exceeds the maximum available to free tier customers"); use 1 there.
  UpgradeDataTypes:
    Type: String
    Default: seed,seed-initial,install,ext-seed,ext,darpan-seed-initial,darpan-seed
    Description: >-
      Data types the entrypoint loads before Moqui starts. The default mirrors the image's DB_LOAD
      first-time load; switch to darpan-seed after the first successful boot.
  TimeZone:
    Type: String
    Default: UTC
  HostName:
    Type: String
    Default: ''
    Description: Public name pointed (CNAME) at the load balancer, e.g. uat-aws.drpn.ai. Empty = the ALB's own name.
  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      ACM certificate for HostName, issued outside this stack (drpn.ai DNS is at Netlify, so validation is a
      manual CNAME). Empty = HTTP only, which Moqui answers with a redirect to https.
  SearchEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Adds an Amazon OpenSearch Service domain and points Moqui's elasticsearch_url at it (DAR-BE-170).
  SearchInstanceType:
    Type: String
    Default: t3.small.search
    AllowedValues: [t3.small.search, t3.medium.search, m7g.large.search]
  WorkerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      DAR-BE-169. Adds the tenant-script worker in its own no-internet VPC (peered to this one) and points Moqui's
      DARPAN_SCRIPT_WORKER_URL at it. Off = scripts run in Moqui as before, and every worker resource is removed.
  WorkerImageTag:
    Type: String
    Default: script-worker-poc2
    Description: Tag of the script-worker image in this stack's ECR repository (k8s-lab/worker.Dockerfile).
  S3PrefixListId:
    Type: String
    Default: pl-7ba54012
    Description: AWS-managed prefix list com.amazonaws.<region>.s3 (pl-7ba54012 in us-east-2); the worker's only non-endpoint egress.
  AlertEmail:
    Type: String
    Description: Where the monthly budget alert goes.
  MonthlyBudgetUsd:
    Type: Number
    Default: 80

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasHostName: !Not [!Equals [!Ref HostName, '']]
  HasSearch: !Equals [!Ref SearchEnabled, 'true']
  HasWorker: !Equals [!Ref WorkerEnabled, 'true']

Resources:
  # ---------- Network ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-a' }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-b' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private subnets keep the VPC's implicit main route table: local traffic only, no internet.

  # ---------- Security groups ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: rehearsal is for one person, so both ports admit AllowedCidr only (80 just redirects once a cert is set)
        must: [never widen to 0.0.0.0/0 while the listener is HTTP]
    Properties:
      GroupDescription: Load balancer - HTTP and HTTPS from AllowedCidr only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Rehearsal access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
          Description: Rehearsal access (TLS)

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Darpan task - 8080 from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: ALB to Moqui

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL from the Darpan task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Darpan to MySQL

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from the Darpan task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Darpan to EFS

  SearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasSearch
    Properties:
      GroupDescription: OpenSearch HTTPS from the Darpan task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Darpan to OpenSearch

  # ---------- Image registry ----------
  Repository:
    Type: AWS::ECR::Repository
    Metadata:
      com.aws.cloudformation.Context:
        why: rehearsal images are rebuildable from darpan-docker-config, so the repo empties on stack delete
    Properties:
      RepositoryName: !Sub '${AWS::StackName}/darpan'
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 10 newest images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

  # ---------- Secrets ----------
  CryptPassSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: entity_ds_crypt_pass encrypts every tenant's stored OMS/Shopify/NetSuite tokens
        must: [never regenerate or replace once tenant connections are saved; retained on stack delete]
    Properties:
      Description: Darpan entity_ds_crypt_pass (UAT rehearsal)
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  JwtKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Darpan JWT_KEY (UAT rehearsal)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  SearchMasterSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasSearch
    Properties:
      Description: OpenSearch master user for Moqui (elasticsearch_user / elasticsearch_password)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"darpan"}'
        GenerateStringKey: password
        PasswordLength: 32
        RequireEachIncludedType: true   # fine-grained access control demands upper, lower, digit and symbol
        ExcludeCharacters: '"''\/@`$&|;%:?#[]{}<>'

  # ---------- Database ----------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Darpan private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: MoquiProductionConf sets pool-maxsize 140; t4g.small's formula default (~150) leaves no headroom for admin sessions
    Properties:
      Description: Darpan MySQL 8.4
      Family: mysql8.4
      Parameters:
        max_connections: '200'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: single-AZ for the rehearsal (prod -> MultiAZ + DeletionProtection); RDS manages and rotates the master password in Secrets Manager
        must: [StorageEncrypted, not publicly accessible]
    Properties:
      Engine: mysql
      EngineVersion: '8.4'
      DBInstanceClass: !Ref DbInstanceClass
      DBName: darpan
      MasterUsername: darpanadmin
      ManageMasterUserPassword: true
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true

  # ---------- Search ----------
  SearchDomain:
    Type: AWS::OpenSearchService::Domain
    Condition: HasSearch
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          one node, one AZ, VPC-only for UAT (prod -> 3 nodes over 2-3 AZs); OpenSearch 2.19 is the line Moqui's
          ElasticFacade targets; indexes are rebuildable from MySQL, so no retain/snapshot on delete
        must:
          - VPC-only + fine-grained access control (the open access policy below is safe only with both)
          - Moqui URL carries :443 (ElasticFacade defaults a port-less URL to 9200)
    Properties:
      DomainName: !Sub '${AWS::StackName}-search'
      EngineVersion: OpenSearch_2.19
      ClusterConfig:
        InstanceType: !Ref SearchInstanceType
        InstanceCount: 1
        ZoneAwarenessEnabled: false
        DedicatedMasterEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 10
      VPCOptions:
        SubnetIds: [!Ref PrivateSubnetA]
        SecurityGroupIds: [!Ref SearchSecurityGroup]
      EncryptionAtRestOptions: { Enabled: true }
      NodeToNodeEncryptionOptions: { Enabled: true }
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-PFS-2023-10
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Sub '{{resolve:secretsmanager:${SearchMasterSecret}:SecretString:username}}'
          MasterUserPassword: !Sub '{{resolve:secretsmanager:${SearchMasterSecret}:SecretString:password}}'
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: '*' }
            Action: es:ESHttp*
            Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${AWS::StackName}-search/*'
      SoftwareUpdateOptions:
        AutoSoftwareUpdateEnabled: true

  # ---------- Run files ----------
  FileSystem:
    Type: AWS::EFS::FileSystem
    Metadata:
      com.aws.cloudformation.Context:
        why: replaces HotWax's datamanager persistent volume (reconciliation-runs, OrderIdMap); rehearsal data is disposable
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      FileSystemTags: [{ Key: Name, Value: !Sub '${AWS::StackName}-datamanager' }]

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]

  DatamanagerAccessPoint:
    Type: AWS::EFS::AccessPoint
    Metadata:
      com.aws.cloudformation.Context:
        why: every write lands as uid/gid 1000, so the volume is already right for the non-root moqui user (DAR-OPS-002)
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: '1000', Gid: '1000' }
      RootDirectory:
        Path: /datamanager
        CreationInfo: { OwnerUid: '1000', OwnerGid: '1000', Permissions: '0775' }

  # ---------- IAM ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-darpan-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref CryptPassSecret
                  - !Ref JwtKeySecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !If [HasSearch, !Ref SearchMasterSecret, !Ref AWS::NoValue]

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: the app itself needs only EFS (IAM-authorized mount) and ECS Exec for debugging; no other AWS access
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: efs-and-exec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals: { 'elasticfilesystem:AccessPointArn': !GetAtt DatamanagerAccessPoint.Arn }
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  # ---------- Logs ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/darpan'
      RetentionInDays: 14

  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '300'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: /status answers only 127.0.0.1 (webroot.xml) and logs every rejection, so the ALB probes / instead
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: '200-399' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Metadata:
      com.aws.cloudformation.Context:
        why: TLS ends at the ALB; it forwards plain HTTP to :8080 with X-Forwarded-Proto https, which Moqui reads to stop its https redirect (same shape as HotWax's ingress)
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- Compute ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-darpan'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: datamanager
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref DatamanagerAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: darpan
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:${ImageTag}'
          Essential: true
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - SourceVolume: datamanager
              ContainerPath: /moqui-framework/runtime/datamanager
          Environment:
            - { Name: Moqui_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: Moqui_DB_NAME, Value: darpan }
            - { Name: Moqui_HOST, Value: !If [HasHostName, !Ref HostName, !GetAtt LoadBalancer.DNSName] }
            - { Name: TIME_ZONE, Value: !Ref TimeZone }
            - { Name: DARPAN_LOAD_UPGRADE_DATA, Value: 'Y' }
            - { Name: DARPAN_UPGRADE_DATA_TYPES, Value: !Ref UpgradeDataTypes }
            # Moqui reads an env var named like a default-property in place of the conf value.
            - !If
              - HasSearch
              - { Name: elasticsearch_url, Value: !Sub 'https://${SearchDomain.DomainEndpoint}:443' }
              - !Ref AWS::NoValue
            # Set = every tenant script runs only in the worker; unreachable worker = WORKER error, never a local run.
            - !If
              - HasWorker
              - { Name: DARPAN_SCRIPT_WORKER_URL, Value: !Sub 'http://worker.${AWS::StackName}.local:8090' }
              - !Ref AWS::NoValue
          Secrets:
            - { Name: Moqui_DB_USER, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::' }
            - { Name: Moqui_DB_PASSWORD, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::' }
            - { Name: entity_ds_crypt_pass, ValueFrom: !Ref CryptPassSecret }
            - { Name: JWT_KEY, ValueFrom: !Ref JwtKeySecret }
            - !If
              - HasSearch
              - { Name: elasticsearch_user, ValueFrom: !Sub '${SearchMasterSecret}:username::' }
              - !Ref AWS::NoValue
            - !If
              - HasSearch
              - { Name: elasticsearch_password, ValueFrom: !Sub '${SearchMasterSecret}:password::' }
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: darpan

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, MountTargetA, MountTargetB]
    Metadata:
      com.aws.cloudformation.Context:
        why: replace-in-place deploys (0% min healthy) so two schedulers never overlap; long grace covers first-boot data load
        must: [DesiredCount <= 1, MaximumPercent 100]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 1800
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: darpan
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ---------- Script worker (DAR-BE-169) ----------
  # The worker holds nothing worth stealing (no DB, no secrets, no task role) and can reach nothing but the three
  # AWS endpoints Fargate itself needs to start it (image pull + logs). It lives in its own VPC because DNS Firewall
  # attaches to a whole VPC: an allow-list tight enough for the worker would cut Moqui off from Shopify/NetSuite/OMS.
  WorkerVpc:
    Type: AWS::EC2::VPC
    Condition: HasWorker
    Metadata:
      com.aws.cloudformation.Context:
        must: [no internet gateway, no NAT, ever; DNS support stays on only for the endpoints' private names]
    Properties:
      CidrBlock: 10.41.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-script-worker' }]

  WorkerSubnetA:
    Type: AWS::EC2::Subnet
    Condition: HasWorker
    Properties:
      VpcId: !Ref WorkerVpc
      CidrBlock: 10.41.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-script-worker-a' }]

  WorkerRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: HasWorker
    Properties:
      VpcId: !Ref WorkerVpc

  WorkerSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasWorker
    Properties:
      SubnetId: !Ref WorkerSubnetA
      RouteTableId: !Ref WorkerRouteTable

  WorkerPeering:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: HasWorker
    Properties:
      VpcId: !Ref Vpc
      PeerVpcId: !Ref WorkerVpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-root-to-worker' }]

  RootToWorkerRoute:
    Type: AWS::EC2::Route
    Condition: HasWorker
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 10.41.0.0/24
      VpcPeeringConnectionId: !Ref WorkerPeering

  WorkerToRootRoute:
    Type: AWS::EC2::Route
    Condition: HasWorker
    Metadata:
      com.aws.cloudformation.Context:
        why: replies go only to the public subnets where the Moqui task runs; RDS/EFS/OpenSearch subnets get no route at all
    Properties:
      RouteTableId: !Ref WorkerRouteTable
      DestinationCidrBlock: 10.40.0.0/23
      VpcPeeringConnectionId: !Ref WorkerPeering

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasWorker
    Properties:
      GroupDescription: Script worker - 8090 from Moqui only; out only to the image/log endpoints
      VpcId: !Ref WorkerVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref WorkerEndpointSecurityGroup
          Description: ECR api/dkr + Logs interface endpoints
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
          Description: ECR image layers (S3 gateway endpoint, policy-limited to the layer bucket)

  WorkerIngressFromRoot:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasWorker
    DependsOn: [WorkerPeering]
    Metadata:
      com.aws.cloudformation.Context:
        why: a peered-VPC security group reference (same Region), so only ENIs in Moqui's group reach :8090, not the ALB or anything else in 10.40.0.0/23
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      IpProtocol: tcp
      FromPort: 8090
      ToPort: 8090
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: Moqui to script worker

  WorkerEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasWorker
    Properties:
      GroupDescription: Interface endpoints in the worker VPC - 443 from the worker only
      VpcId: !Ref WorkerVpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: endpoints never initiate; no egress

  WorkerEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasWorker
    Properties:
      GroupId: !Ref WorkerEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
      Description: Script worker (Fargate agent) to endpoints

  # Endpoint policies close the "send it to my own account" paths: an escaped script holding an attacker's own
  # credentials could otherwise push to their ECR, put to their bucket or write to their log group through these.
  WorkerEcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasWorker
    Properties:
      VpcId: !Ref WorkerVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref WorkerSubnetA]
      SecurityGroupIds: [!Ref WorkerEndpointSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  WorkerEcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasWorker
    Properties:
      VpcId: !Ref WorkerVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref WorkerSubnetA]
      SecurityGroupIds: [!Ref WorkerEndpointSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  WorkerLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasWorker
    Properties:
      VpcId: !Ref WorkerVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref WorkerSubnetA]
      SecurityGroupIds: [!Ref WorkerEndpointSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals: { 'aws:PrincipalAccount': !Ref AWS::AccountId }

  WorkerS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasWorker
    Metadata:
      com.aws.cloudformation.Context:
        why: layer downloads are presigned by ECR (not by this account), so the limit is the bucket, per the ECR VPC-endpoint guide
    Properties:
      VpcId: !Ref WorkerVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref WorkerRouteTable]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::prod-${AWS::Region}-starport-layer-bucket/*'

  # DNS: the Route 53 Resolver answers every VPC and no security group can stop it, so without this an escaped
  # script could leak data in the names it looks up. Only the endpoint names resolve; everything else is NXDOMAIN.
  WorkerDnsAllowList:
    Type: AWS::Route53Resolver::FirewallDomainList
    Condition: HasWorker
    Properties:
      Name: !Sub '${AWS::StackName}-worker-allow'
      Domains:
        - !Sub 'api.ecr.${AWS::Region}.amazonaws.com'
        - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
        - !Sub 'logs.${AWS::Region}.amazonaws.com'
        - !Sub 'prod-${AWS::Region}-starport-layer-bucket.s3.${AWS::Region}.amazonaws.com'
        - !Sub 'prod-${AWS::Region}-starport-layer-bucket.s3.amazonaws.com'
        - !Sub 's3.${AWS::Region}.amazonaws.com'

  WorkerDnsBlockAll:
    Type: AWS::Route53Resolver::FirewallDomainList
    Condition: HasWorker
    Properties:
      Name: !Sub '${AWS::StackName}-worker-block-all'
      Domains: ['*']

  WorkerDnsRules:
    Type: AWS::Route53Resolver::FirewallRuleGroup
    Condition: HasWorker
    Properties:
      Name: !Sub '${AWS::StackName}-worker-dns'
      FirewallRules:
        - Priority: 100
          FirewallDomainListId: !Ref WorkerDnsAllowList
          Action: ALLOW
          FirewallDomainRedirectionAction: TRUST_REDIRECTION_DOMAIN
        - Priority: 200
          FirewallDomainListId: !Ref WorkerDnsBlockAll
          Action: BLOCK
          BlockResponse: NXDOMAIN

  WorkerDnsRulesAssociation:
    Type: AWS::Route53Resolver::FirewallRuleGroupAssociation
    Condition: HasWorker
    Properties:
      Name: !Sub '${AWS::StackName}-worker-dns'
      FirewallRuleGroupId: !Ref WorkerDnsRules
      VpcId: !Ref WorkerVpc
      Priority: 101
      MutationProtection: DISABLED

  # Moqui finds the worker by name; the namespace's zone is attached to Moqui's VPC, not the worker's.
  WorkerNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: HasWorker
    Properties:
      Name: !Sub '${AWS::StackName}.local'
      Vpc: !Ref Vpc

  WorkerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasWorker
    Properties:
      Name: worker
      NamespaceId: !Ref WorkerNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: A, TTL: 10 }]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasWorker
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/script-worker'
      RetentionInDays: 7

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasWorker
    Metadata:
      com.aws.cloudformation.Context:
        why: its own role so the agent that starts the worker cannot read Moqui's secrets; image pull + log writes only
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasWorker
    Metadata:
      com.aws.cloudformation.Context:
        must:
          - no TaskRoleArn (the container gets no AWS credentials at all)
          - no Secrets, no Environment carrying anything from Moqui
          - container memory cap stays well above heap (MaxRAMPercentage 70); the kernel kill is the hard ceiling
    Properties:
      Family: !Sub '${AWS::StackName}-script-worker'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      # No volumes: the worker writes nothing (perf data off), and uid 10001 has no writable path at all (checked by
      # aws/worker-guardrail-check.sh). A Fargate bind mount would be root-owned and unwritable anyway.
      ContainerDefinitions:
        - Name: worker
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:${WorkerImageTag}'
          Essential: true
          Memory: 384
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities: { Drop: [ALL] }
          PortMappings:
            - ContainerPort: 8090
              Protocol: tcp
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8090/health || exit 1']
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WorkerService:
    Type: AWS::ECS::Service
    Condition: HasWorker
    DependsOn:
      - WorkerEcrApiEndpoint
      - WorkerEcrDkrEndpoint
      - WorkerLogsEndpoint
      - WorkerS3Endpoint
      - WorkerSubnetARoutes
      - WorkerDnsRulesAssociation
      - WorkerIngressFromRoot
      - WorkerEndpointIngress
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref WorkerSubnetA]
          SecurityGroups: [!Ref WorkerSecurityGroup]
      ServiceRegistries:
        - RegistryArn: !GetAtt WorkerDiscovery.Arn

  # ---------- Cost guard ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  BaseUrl:
    Value: !If
      - HasCertificate
      - !Sub ['https://${Name}', { Name: !If [HasHostName, !Ref HostName, !GetAtt LoadBalancer.DNSName] }]
      - !Sub 'http://${LoadBalancer.DNSName}'
  LoadBalancerDnsName:
    Description: CNAME target for HostName
    Value: !GetAtt LoadBalancer.DNSName
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  SearchEndpoint:
    Condition: HasSearch
    Value: !Sub 'https://${SearchDomain.DomainEndpoint}'
  WorkerSubnetId:
    Condition: HasWorker
    Value: !Ref WorkerSubnetA
  WorkerSecurityGroupId:
    Condition: HasWorker
    Value: !Ref WorkerSecurityGroup
  WorkerTaskDefinitionArn:
    Condition: HasWorker
    Description: Probe tasks run this with a command override (guardrail checks in the worker's own position)
    Value: !Ref WorkerTaskDefinition
  WorkerUrl:
    Condition: HasWorker
    Value: !Sub 'http://worker.${AWS::StackName}.local:8090'
