# DAR-BE-169 lab: Darpan root pod + script worker pods on a local kind cluster.
#   darpan-lab      root (Moqui, DB creds, tenant tokens) + MySQL
#   darpan-scripts  script workers: Pod Security "restricted" enforced, default-deny network, ingress only from root
# Secrets are created at apply time (see README.md), never stored here.
apiVersion: v1
kind: Namespace
metadata:
  name: darpan-lab
---
apiVersion: v1
kind: Namespace
metadata:
  name: darpan-scripts
  labels:
    # The API server rejects any pod here that runs as root, keeps capabilities, allows privilege escalation, etc.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# ---------------- darpan-lab: MySQL ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: darpan-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_DATABASE, value: darpan }
            - { name: MYSQL_USER, value: darpan }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: darpan-secrets, key: db-password } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: darpan-secrets, key: db-root-password } }
          ports: [{ containerPort: 3306 }]
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: init, configMap: { name: mysql-init } }
---
# Bitronix runs XA RECOVER at startup; MySQL 8 allows it only with XA_RECOVER_ADMIN. Without it Moqui fails with
# "XAER_RMERR: Fatal error occurred in the transaction branch". (RDS's master user already has it.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: darpan-lab
data:
  01-xa-recover.sql: |
    GRANT XA_RECOVER_ADMIN ON *.* TO 'darpan'@'%';
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: darpan-lab
spec:
  selector: { app: mysql }
  ports: [{ port: 3306 }]
---
# ---------------- darpan-lab: root ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darpan-root
  namespace: darpan-lab
spec:
  replicas: 1   # Moqui's scheduler runs in-process: one root only
  strategy: { type: Recreate }
  selector: { matchLabels: { app: darpan-root } }
  template:
    metadata: { labels: { app: darpan-root } }
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37
          command: ['sh', '-c', 'until nc -z mysql 3306; do sleep 2; done']
      containers:
        - name: darpan
          image: darpan-root:lab
          imagePullPolicy: Never
          env:
            - { name: Moqui_DB_HOST, value: mysql }
            - { name: Moqui_DB_NAME, value: darpan }
            - { name: Moqui_DB_USER, value: darpan }
            - name: Moqui_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: darpan-secrets, key: db-password } }
            - name: entity_ds_crypt_pass
              valueFrom: { secretKeyRef: { name: darpan-secrets, key: crypt-pass } }
            - name: JWT_KEY
              valueFrom: { secretKeyRef: { name: darpan-secrets, key: jwt-key } }
            - { name: TIME_ZONE, value: UTC }
            - { name: DARPAN_UPGRADE_DATA_TYPES, value: 'seed,seed-initial,install,ext-seed,ext,darpan-seed-initial,darpan-seed' }
            # The one switch: with this set, every tenant script runs in the worker and nowhere else.
            - { name: DARPAN_SCRIPT_WORKER_URL, value: 'http://script-worker.darpan-scripts.svc.cluster.local:8090' }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { memory: 2Gi, cpu: 500m }
            limits: { memory: 3Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: darpan-root
  namespace: darpan-lab
spec:
  selector: { app: darpan-root }
  ports: [{ port: 8080 }]
---
# ---------------- darpan-scripts: worker ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: script-worker
  namespace: darpan-scripts
spec:
  replicas: 1
  selector: { matchLabels: { app: script-worker } }
  template:
    metadata: { labels: { app: script-worker } }
    spec:
      automountServiceAccountToken: false   # no Kubernetes API credentials inside the worker
      enableServiceLinks: false             # no env vars describing other services
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: darpan-script-worker:lab
          imagePullPolicy: Never
          ports: [{ containerPort: 8090 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { memory: 256Mi, cpu: 250m }
            limits: { memory: 384Mi, cpu: '1' }   # the hard ceiling: over it, the kernel kills this container only
          readinessProbe:
            httpGet: { path: /health, port: 8090 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: script-worker
  namespace: darpan-scripts
spec:
  selector: { app: script-worker }
  ports: [{ port: 8090 }]
---
# Default deny: nothing in or out of any pod in darpan-scripts, not even DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: darpan-scripts
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The single opening: the Darpan root pod may call the worker on 8090.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-from-root-only
  namespace: darpan-scripts
spec:
  podSelector: { matchLabels: { app: script-worker } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: darpan-lab } }
          podSelector: { matchLabels: { app: darpan-root } }
      ports: [{ port: 8090 }]
